<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Basic JavaScript</title>
    </head>
    <body>
        <h2>Welcome to the world of JavaScript!</h2>
        <script>
            let name = "Summit";
            let favouritesubject = "Math";
            let grade = 5;
            console.log(`My name is ${name}. My favourite subject is ${favouritesubject}. I am in grade ${grade}`);
            let student = {name: "Anay", favouritesubject: "computer science", grade: 6};
            document.write("My name is " + student.name +" My favourite subject is " + student.favouritesubject + " I am in grade " + student.grade);
        </script>
        
    </body>
</html>
